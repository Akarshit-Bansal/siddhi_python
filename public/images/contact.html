{% load static %}

<!DOCTYPE html>
<html>
<head>
    <title>Email Us</title>

    <style>

        body{
            font-family:Arial;
            background:#f5f5f5;
            margin:0;
            padding:0;
        }

        .contact-container{
            width:500px;
            margin:60px auto;
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 5px 15px rgba(0,0,0,0.15);
        }

        h1{
            text-align:center;
            color:#8b0000;
            margin-bottom:30px;
        }

        input, textarea{
            width:100%;
            padding:12px;
            margin-bottom:20px;
            border:1px solid #ccc;
            border-radius:6px;
            font-size:16px;
        }

        button{
            width:100%;
            background:#8b0000;
            color:white;
            border:none;
            padding:14px;
            font-size:18px;
            border-radius:6px;
            cursor:pointer;
        }

        button:hover{
            background:#a50000;
        }

        .success{
            color:green;
            text-align:center;
            margin-top:20px;
        }

    </style>

</head>

<body>

<div class="contact-container">

    <h1>Email Us</h1>

    <form method="POST" enctype="multipart/form-data">
    {% csrf_token %}

    <input type="text" name="name" placeholder="Full Name" required>

    <input type="email" name="email" placeholder="Email" required>

    <input type="text" name="phone" placeholder="Phone Number" required>

    <textarea name="message" placeholder="Message"></textarea>

    <label>Upload CV</label>
    <input type="file" name="cv" required>

    <button type="submit">
        Submit Application
    </button>
    </form>

{% if success %}
<p style="color:green;">
    Application submitted successfully!
</p>
{% endif %}

</div>

</body>
</html>
